<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業撞球計分系統</title>
    <link rel="stylesheet" href="Scoreboard.css">
</head>
<body>
    <div id="lobby" class="lobby-overlay">
        <div class="lobby-card">
            <h1>BILLIARDS</h1>
            <div class="input-group">
                <label>選手 1 姓名</label>
                <input type="text" id="p1-input" placeholder="輸入姓名..." value="選手 1">
            </div>
            <div class="input-group">
                <label>選手 2 姓名</label>
                <input type="text" id="p2-input" placeholder="輸入姓名..." value="選手 2">
            </div>
            <div class="input-group">
                <label>搶分數 (Race to)</label>
                <input type="number" id="race-input" value="5">
            </div>
            <button id="start-btn" onclick="startGame()">開始比賽</button>
        </div>
    </div>

    <div class="scoreboard-container">
        <div class="player-section" id="p1-area">
            <div class="box header" id="p1-name">選手 1</div>
            <div class="box score-display" id="p1-total" 
                 onclick="changeValue('p1', 'total', 1)" 
                 oncontextmenu="changeValue('p1', 'total', -1); return false;">0</div>
            
            <div class="box info-box" 
                 onclick="changeValue('p1', 'inning', 1)" 
                 oncontextmenu="changeValue('p1', 'inning', -1); return false;">
                單局得分：<span id="p1-inning">0</span>
            </div>
            
            <div class="box info-box foul" 
                 onclick="changeValue('p1', 'fouls', 1)" 
                 oncontextmenu="changeValue('p1', 'fouls', -1); return false;">
                犯規次數：<span id="p1-fouls">0</span>
            </div>
        </div>

        <div class="center-control">
            <div id="timer">00:00</div>
            <div id="race-info">R <span id="race-display">5</span></div>
            <button class="control-btn" onclick="resetScores()">清除單局</button>
            <button class="control-btn" onclick="location.reload()">重新比賽</button>
            <button class="control-btn" id="fullscreen-btn" onclick="toggleFull()">全螢幕</button>
        </div>

        <div class="player-section" id="p2-area">
            <div class="box header" id="p2-name">選手 2</div>
            <div class="box score-display" id="p2-total" 
                 onclick="changeValue('p2', 'total', 1)" 
                 oncontextmenu="changeValue('p2', 'total', -1); return false;">0</div>
            
            <div class="box info-box" 
                 onclick="changeValue('p2', 'inning', 1)" 
                 oncontextmenu="changeValue('p2', 'inning', -1); return false;">
                單局得分：<span id="p2-inning">0</span>
            </div>
            
            <div class="box info-box foul" 
                 onclick="changeValue('p2', 'fouls', 1)" 
                 oncontextmenu="changeValue('p2', 'fouls', -1); return false;">
                犯規次數：<span id="p2-fouls">0</span>
            </div>
        </div>
    </div>

    <script src="Scoreboard.js"></script>
</body>
</html>
