<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專業撞球計分系統</title>
    <link rel="stylesheet" href="Scoreboard.css">
</head>
<body>

    <div class="scoreboard-container">
        <div class="player-section" id="p1-area">
            <div class="box header clickable" id="p1-name" data-player="p1" data-type="inning">選手 1</div>
            
            <div class="box score-display clickable" id="p1-total" data-player="p1" data-type="inning">0</div>
            
            <div class="box info-box clickable" data-player="p1" data-type="inning">
                <span id="p1-inning">0</span>
            </div>
            
            <div class="box info-box clickable" data-player="p1" data-type="fouls">
                <span id="p1-fouls">0</span>
            </div>
        </div>

        <div class="center-control">
            <div class="center-row row-header">
                <div id="timer">00:00</div>
            </div>
            
            <div class="center-row row-score">
                <div class="top-button-group">
                    <button class="control-btn" onclick="returnToLobby()">回主大廳</button>
                    <button class="control-btn" onclick="toggleFull()">全螢幕</button>
                </div>

                <div id="race-info">(<span id="race-display">5</span>)</div>
                
                <div class="bottom-button-group">
                    <button id="next-inning-btn" class="control-btn next-btn" onclick="processNextInning()">下一局</button>
                </div>
            </div>

            <div class="center-row row-info"><div class="label-text">單局得分</div></div>
            <div class="center-row row-info"><div class="label-text">單局犯規</div></div>
        </div>

        <div class="player-section" id="p2-area">
            <div class="box header clickable" id="p2-name" data-player="p2" data-type="inning">選手 2</div>
            
            <div class="box score-display clickable" id="p2-total" data-player="p2" data-type="inning">0</div>
            
            <div class="box info-box clickable" data-player="p2" data-type="inning">
                <span id="p2-inning">0</span>
            </div>
            
            <div class="box info-box clickable" data-player="p2" data-type="fouls">
                <span id="p2-fouls">0</span>
            </div>
        </div>
    </div>

    <script src="Scoreboard.js"></script>
</body>
</html>
